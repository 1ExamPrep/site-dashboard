# Render Blueprint: one web service + one Postgres database.
# In Render: New → Blueprint → pick this repo. Then set ADMIN_EMAIL / ADMIN_PASSWORD in the service's Environment tab.
services:
  - type: web
    name: site-dashboard
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: site-dashboard-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: TZ_NAME
        value: America/Chicago
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
databases:
  - name: site-dashboard-db
    plan: basic-256mb
